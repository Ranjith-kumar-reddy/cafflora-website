# Render Blueprint for Cafflora: one Node web service that serves the website and the API.
# In Render choose New > Blueprint and pick this repository. Render asks for the values
# marked "sync: false" when the service is created.
services:
  - type: web
    name: cafflora
    runtime: node
    region: singapore
    # Free plan (owner's choice, no payment). It sleeps after 15 minutes without visitors,
    # so the next visitor waits close to a minute. Change to "starter" to keep it always on.
    plan: free
    # Vite is a dev dependency, so the build has to install dev dependencies too.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/config
    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB Atlas connection string, ending in /cafflora
      - key: MONGODB_URI
        sync: false
      # The OAuth client ID from the Google Cloud project "cafflora"
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Render creates a new random secret; it is not the one in server/.env
      - key: SESSION_SECRET
        generateValue: true
      # Google accounts that can open /staff, separated by commas
      - key: STAFF_EMAILS
        sync: false
      - key: TABLE_COUNT
        value: "12"
